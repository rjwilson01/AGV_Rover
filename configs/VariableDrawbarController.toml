[drawbar]
controller_class = "VariableDrawbarController"
mode = "variable"
rear_bar_range_m = [1.00, 1.50]
front_bar_range_m = [1.00, 1.50]
# Limit on the commanded trailer-to-trailer yaw per hitch (rear bar yaw + front bar yaw + ball yaw).
# The per-bar tube limits are in [bars] below; ball_joint_limit_deg is the physical stop on the ball.
yaw_angle_range_deg = [-40.0, 50.0]
telescoping_kp = 18000.0
telescoping_kv = 900.0
telescoping_max_force_n = 8000.0

[geometry]
ball_joint_limit_deg = 55.0

[controller]
active_path = "u_turn_180"
v_center_mps = 1.05
lookahead_dist_m = 1.60
max_curvature = 0.55
yaw_gain = -1.00
actuator_lead_offset_m = 0.35

[bars]
# Each drawbar sits in a tube that pivots (yaw) near the trailer edge. Two horizontal cables
# (pull/pull) set the tube yaw. The ball joint between the two bar tips is passive.
# Geometry values below are PLACEHOLDERS - replace with the real build.
yaw_control = true
keep_trailer_cables = true            # also keep the 4 trailer-to-trailer cables (pitch/roll hold). false = tube cables only
rear_yaw_range_deg = [-25.0, 25.0]    # commanded yaw range of each rear tube (rear bar of trailer n)
front_yaw_range_deg = [-25.0, 25.0]   # commanded yaw range of each front tube (front bar of trailer n+1)
pivot_inset_m = 0.05                  # tube pivot sits this far inside the chassis end
cable_arm_m = 0.20                    # cable attachment point distance along the tube from the pivot
cable_tube_half_width_m = 0.04        # lateral offset of each cable attachment on the tube
yaw_damping = 8.0
yaw_hinge_margin_deg = 5.0            # hinge stop sits this far beyond the commanded range
